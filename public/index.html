<html lang="zh-CN"><meta charset="utf-8"><title>组件化设备目录的组合树与展示代际采集</title><body><h1>授权设备目录</h1><button id="switch">切换设备</button><button id="slot">重分配标签</button><button id="reload">重载报价</button><device-card id="card"><strong slot="label">额定功率</strong></device-card><script>
class DeviceCard extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'});this.shadowRoot.innerHTML='<article data-device="D-1" data-generation="1"><slot name="label">默认功率</slot><span id="power">8 kW</span><iframe title="设备报价"></iframe></article>';}}
customElements.define('device-card',DeviceCard);const card=document.querySelector('#card');const article=card.shadowRoot.querySelector('article');const frame=card.shadowRoot.querySelector('iframe');const quote=()=>`http://localhost:${location.port}/quote.html?nonce=${Date.now()}`;frame.src=quote();
document.querySelector('#switch').onclick=async()=>{article.dataset.device='D-2';article.dataset.generation='2';await fetch('/control',{method:'POST',body:JSON.stringify({device:'D-2',generation:2})});setTimeout(async()=>{await fetch('/control',{method:'POST',body:JSON.stringify({price:'1800.00',power:'12 kW'})});card.shadowRoot.querySelector('#power').textContent='12 kW';frame.src=quote();},120);};document.querySelector('#slot').onclick=()=>{card.querySelector('strong').slot='unused';};document.querySelector('#reload').onclick=()=>frame.src=quote();</script></body></html>
